name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release version or the commit you run.
      placeholder: 0.1.1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 arm64
    validations:
      required: true
  - type: textarea
    id: bundle
    attributes:
      label: Logs or support bundle
      description: Paste the exact error text, or drag in a support bundle if the project makes one. Remove secrets first.
