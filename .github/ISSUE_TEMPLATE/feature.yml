name: Feature request
description: Something you want that does not exist yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you try to do and what blocks you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you want to happen. Leave blank if you are not sure.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What you do today instead.
