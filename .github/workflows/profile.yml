name: profile
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: [profile/build.py, .github/workflows/profile.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 profile/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit when the picture changed
        run: |
          git add profile/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "profile: rebuild terminal"
          git push
